name: ci
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # same-repo pull requests already ran on push; only forks need the pull_request run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable # go.mod sets the floor (1.26); test on what developers use
      - run: go vet ./...
      - if: ${{ !cancelled() }}
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - if: ${{ !cancelled() }}
        run: go test -race ./...
        env:
          AIO_REAL_DEVICE_TESTS: "1" # disposable CI machines only: opens a real disk read-only

      # Linux only from here: they don't depend on the OS, so once is enough
      - name: worker tests with the memory cap on (it is off under -race on Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: go test -count=1 ./internal/worker
      - name: cross-compile all targets
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          for os in windows darwin linux; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/aio-sdcard-doctor
          done; done
      - name: licence check and notices (same script the release runs)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sh scripts/notices.sh
      - name: disk-full test on a 4 MiB tmpfs
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sudo mkdir -p /mnt/tiny && sudo mount -t tmpfs -o size=4m tmpfs /mnt/tiny && sudo chmod 777 /mnt/tiny
          AIO_TMPFS=/mnt/tiny go test -count=1 -run TestDiskFullTmpfs ./internal/rescue
      - name: fuzz smoke
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          for pkg in $(go list ./internal/...); do
            for f in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              go test -run '^$' -fuzz "^$f\$" -fuzztime 15s "$pkg"
            done
          done

  # the whole release (archives, packages, checksums; nothing published); only on main
  release-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean # the whole release: archives, packages, checksums (nothing published)
