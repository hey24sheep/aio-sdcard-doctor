name: fsimages
# Rebuilds internal/fsread/testdata/realfs with the real mkfs tools and checks the readers
# against them. Run by hand (Actions → fsimages → Run workflow) after changing
# scripts/gen-fs-images.sh, then commit the images from the artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fsimages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build file-system images with the real mkfs tools (dev-only, never shipped)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mtools dosfstools exfatprogs ntfs-3g e2fsprogs xorriso parted
          sudo bash scripts/gen-fs-images.sh "$RUNNER_TEMP/fsimages"
      - run: AIO_FSIMAGES="$RUNNER_TEMP/fsimages" go test -count=1 -run TestRealFSImages ./internal/fsread
      - name: keep the images (copy into internal/fsread/testdata/realfs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fsimages
          path: ${{ runner.temp }}/fsimages/*.img.gz
          retention-days: 3

