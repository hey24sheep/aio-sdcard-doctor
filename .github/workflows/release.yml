name: release

# Runs only when a version tag (v1.2.3) is pushed. It builds the same archives and packages as
# the CI snapshot, adds an SBOM per archive and a signed build-provenance attestation for every
# file in checksums.txt, and uploads them to a DRAFT release: nothing is public until the owner
# presses Publish on GitHub. Actions are pinned by commit because this job can write releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release
  id-token: write # Sigstore certificate for the attestation
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser's changelog
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Anyone can check a download with: gh attestation verify <file> --repo hey24sheep/aio-sdcard-doctor
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
